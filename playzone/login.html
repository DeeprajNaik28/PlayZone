<!DOCTYPE html>
<html lang="en">

<head>


  <link rel="stylesheet" href="home.html" />
  <title>Login page</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width" />
  <link rel="stylesheet" href="assets/css/login.css">

</head>

<body>

  <script>



    function validation() {
      var a = document.forms["myform"]["name"].value;
      var b = 0;
      if (a == "" || a == null) {
        alert("Username is Required!")
      } else {
        b++
      }
      var a = document.forms["myform"]["password"].value
      if (a == "" || a == null || a.length < 6) {
        alert("Enter a 6 character Password!")
      } else {
        b++
      }
      var a = document.forms["myform"]["email"].value
      var atpos = a.indexOf("@");
      var dotpos = a.lastIndexOf(".");
      if (atpos < 1 || dotpos < atpos + 2 || dotpos + 2 >= a.length) {
        alert("Enter valid Email address!");
        return false;
      } else {
        b++
      }
      if (b == 3) {
        alert(" Validation Succesful", window.location.href = 'home.html');
      }
    }


  </script>




  <div class="container">
    <div class="center">
      <h1>Login</h1>
      <img src="assets/images/logo.jpg" alt="" style="width: 100px; border-radius: 50%; margin-left: 37% ; ">

      <form name="myform" action="" method="POST">
        <div class="txt_field">
          <input type="text" name="name" required>
          <span></span>
          <label>Username</label>
        </div>
        <div class="txt_field">
          <input type="password" name="password" required>
          <span></span>
          <label>Password</label>
        </div>

        <div class="txt_field">
          <input type="text" name="email" required>
          <span></span>
          <label>Email</label>
        </div>






        <input name="submit" type="Submit" value="Login" onclick="validation()">
        <div class="signup_link">
          <a href="terms.html">terms and conditions</a>
          <br>

        </div>


      </form>
    </div>

  </div>
</body>

</html>
